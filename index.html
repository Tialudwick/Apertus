<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertus | Maine Recovery Residence Bed Tracker</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/accessibility.css">
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-theme">
    <!-- Navigation Banner -->
    <br>
    <header role="nav-banner" class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand" aria-label="Apertus Home">
                <img src="assets/apertus_logo.png" alt="Apertus Logo" class="brand-logo">
            </a>
            <div class="nav-actions">
                <!-- Redirects to dedicated dashboard page -->
                <a href="dashboard.html" class="btn btn-blue" id="portalNavBtn">
                    Manager & Owner Portal
                </a>
            </div>
        </div>
    </header>

    <!-- Top Header -->
    <header role="banner" class="header-banner">
        <div class="header-container">
            <div class="header-title-group">
                <h1>Maine Sober Living Bed Tracker</h1>
                <p class="subtitle">Statewide bed availability across recovery residences</p>
            </div>
            
            <div class="header-actions">
                <div class="occupancy-stat">
                    <span class="stat-percentage" id="totalOccupancyPct">0%</span>
                    <span class="stat-label">occupancy</span>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" role="main" class="container" style="margin-top: 1.5rem;">
        
        <!-- Heading for Metric KPI -->
        <section>
            <div class="heading-bar">
                <h3>State Wide Available Beds</h3>
            </div>
        </section>

        <!-- Metric KPI Cards Section -->
        <section class="kpi-grid" aria-label="Statewide Bed Summary">
            <div class="kpi-card">
                <span class="badge badge-available">Available</span>
                <div class="kpi-value" id="kpiAvailable">0</div>
                <div class="kpi-subtext" id="kpiAvailableSub">loading...</div>
            </div>

            <div class="kpi-card">
                <span class="badge badge-occupied">Occupied</span>
                <div class="kpi-value" id="kpiOccupied">0</div>
                <div class="kpi-subtext" id="kpiOccupiedSub">loading...</div>
            </div>

            <div class="kpi-card">
                <span class="badge badge-reserved">Reserved</span>
                <div class="kpi-value" id="kpiReserved">0</div>
                <div class="kpi-subtext" id="kpiReservedSub">loading...</div>
            </div>

            <div class="kpi-card">
                <span class="badge badge-maintenance">Maintenance</span>
                <div class="kpi-value" id="kpiMaintenance">0</div>
                <div class="kpi-subtext" id="kpiMaintenanceSub">loading...</div>
            </div>
        </section>

        <!-- Dynamic Search & Filter Controls -->
        <section class="filter-card" aria-label="Bed Directory Filters">
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="searchInput">Search Residence / City</label>
                    <input type="search" id="searchInput" placeholder="e.g., Portland, Hope House...">
                </div>
                <div class="filter-group">
                    <label for="regionFilter">Region</label>
                    <select id="regionFilter">
                        <option value="">All Regions</option>
                        <option value="Southern Maine">Southern Maine</option>
                        <option value="Central Maine">Central Maine</option>
                        <option value="Western Maine">Western Maine</option>
                        <option value="Northern Maine">Northern Maine</option>
                        <option value="Downeast">Downeast</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="countyFilter">County</label>
                    <select id="countyFilter">
                        <option value="">All Counties</option>
                        <option value="Androscoggin">Androscoggin</option>
                        <option value="Aroostook">Aroostook</option>
                        <option value="Cumberland">Cumberland</option>
                        <option value="Franklin">Franklin</option>
                        <option value="Hancock">Hancock</option>
                        <option value="Kennebec">Kennebec</option>
                        <option value="Knox">Knox</option>
                        <option value="Lincoln">Lincoln</option>
                        <option value="Oxford">Oxford</option>
                        <option value="Penobscot">Penobscot</option>
                        <option value="Piscataquis">Piscataquis</option>
                        <option value="Sagadahoc">Sagadahoc</option>
                        <option value="Somerset">Somerset</option>
                        <option value="Waldo">Waldo</option>
                        <option value="Washington">Washington</option>
                        <option value="York">York</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="genderFilter">Demographic</label>
                    <select id="genderFilter">
                        <option value="">All Demographics</option>
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                        <option value="Co-Ed">Co-Ed</option>
                        <option value="LGBTQ+">LGBTQ+</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="supportFilter">Level of Support</label>
                    <select id="supportFilter">
                        <option value="">All Support Levels</option>
                        <option value="1">Level I - Peer Run</option>
                        <option value="2">Level II - Monitored</option>
                        <option value="3">Level III - Supervised</option>
                        <option value="4">Level IV - Service Provider</option>
                    </select>
                </div>
            </div>
            <div class="filter-toggle-row" style="margin-top: 1rem;">
                <label class="toggle-container">
                    <input type="checkbox" id="availableOnlyToggle">
                    <span class="toggle-label">Show Immediate Bed Openings Only</span>
                </label>
            </div>
        </section>

        <!-- Organizations Grid Section -->
        <section class="directory-section">
            <h2 class="section-heading">Organizations across Maine</h2>
            <div id="houseGrid" class="organizations-grid" aria-live="polite"></div>
        </section>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
